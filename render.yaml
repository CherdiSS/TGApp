# Blueprint для Render: New → Blueprint → выбрать этот репозиторий.
services:
  - type: web
    name: cafe-miniapp-api
    runtime: docker
    rootDir: backend
    # Бот работает через long polling, поэтому инстанс не должен засыпать,
    # а SQLite нужен постоянный диск — бесплатный план для этого не подходит.
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_CHAT_ID
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
